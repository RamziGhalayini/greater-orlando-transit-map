name: Build map data and publish

on:
  schedule:
    - cron: "17 9 * * 1"   # every Monday, 5:17 AM Eastern
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["sources.json", "manual/**", "scripts/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download feeds and build GeoJSON
        run: python scripts/build.py
      - name: Save updated data to the repo
        run: |
          git config user.name "map-data-bot"
          git config user.email "map-data-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update map data $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
